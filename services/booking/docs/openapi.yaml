openapi: 3.0.3
info:
  title: Bookly Booking Service
  description: >
    Coworking spaces and their bookings. Tokens are issued by the Auth service
    (POST /login on port 8081) and checked here through gRPC.
  version: 1.0.0
servers:
  - url: http://localhost:8082
paths:
  /health:
    get:
      summary: Health check
      tags: [system]
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /spaces:
    get:
      summary: List coworking spaces
      tags: [spaces]
      responses:
        "200":
          description: All spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Space"
    post:
      summary: Create a space (admin only)
      tags: [spaces]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceRequest"
      responses:
        "201":
          description: Space created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /spaces/{id}:
    get:
      summary: Get a space
      tags: [spaces]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /bookings:
    get:
      summary: List my bookings
      tags: [bookings]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bookings of the current user, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Book a space
      description: >
        Fails with 409 if the space is already booked for an overlapping period.
        Concurrent requests for the same slot are safe, exactly one wins.
      tags: [bookings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bookings/{id}:
    get:
      summary: Get a booking (owner or admin)
      tags: [bookings]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Cancel a booking (owner or admin)
      tags: [bookings]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The cancelled booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not allowed to do this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicts with existing data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    Space:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Quiet Room
        description:
          type: string
        capacity:
          type: integer
          example: 4
        created_at:
          type: string
          format: date-time
    CreateSpaceRequest:
      type: object
      required: [name, capacity]
      properties:
        name:
          type: string
          example: Phone Booth
        description:
          type: string
        capacity:
          type: integer
          minimum: 1
          example: 1
    Booking:
      type: object
      properties:
        id:
          type: integer
          format: int64
        space_id:
          type: integer
          format: int64
        space_name:
          type: string
        user_id:
          type: integer
          format: int64
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, cancelled]
        created_at:
          type: string
          format: date-time
    CreateBookingRequest:
      type: object
      required: [space_id, start_time, end_time]
      properties:
        space_id:
          type: integer
          format: int64
          example: 1
        start_time:
          type: string
          format: date-time
          description: Must be in the future
          example: "2030-01-15T10:00:00Z"
        end_time:
          type: string
          format: date-time
          description: After start_time, at most 12 hours later
          example: "2030-01-15T12:00:00Z"
