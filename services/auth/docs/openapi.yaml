openapi: 3.0.3
info:
  title: Bookly Auth Service
  description: Registration, login and JWT access tokens for Bookly.
  version: 1.0.0
servers:
  - url: http://localhost:8081
paths:
  /health:
    get:
      summary: Health check
      tags: [system]
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /register:
    post:
      summary: Register a new user
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Invalid JSON, empty fields or a password shorter than 8 characters
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: A user with this email already exists
          content:
            text/plain:
              schema:
                type: string
  /login:
    post:
      summary: Log in and get an access token
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid JSON
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Wrong email or password
          content:
            text/plain:
              schema:
                type: string
  /me:
    get:
      summary: Who am I
      description: Returns the user id and role stored in the access token.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    example: "1"
                  role:
                    type: string
                    example: user
        "401":
          description: Missing, malformed or expired token
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: anna@example.com
        password:
          type: string
          minLength: 8
          example: secret-password
        name:
          type: string
          example: Anna
    RegisterResponse:
      type: object
      properties:
        message:
          type: string
        email:
          type: string
        name:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: anna@example.com
        password:
          type: string
          example: secret-password
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT, send it as "Authorization: Bearer <token>"
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
