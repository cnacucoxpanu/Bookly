
services:
  postgres:
    image: postgres:18
    container_name: bookly2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - bookly2_postgres_data:/var/lib/postgresql

volumes:
  bookly2_postgres_data: